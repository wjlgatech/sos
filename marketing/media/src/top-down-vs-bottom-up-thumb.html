<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="./shared.css">
<style>
  .board{width:1200px;height:627px;padding:52px 60px;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;align-items:center;gap:14px}
  .brandmark{width:34px;height:34px;border-radius:9px;background:var(--terra);display:grid;place-items:center;color:#fff;font-weight:800;font-family:var(--font-sans);font-size:18px}
  .kicker{font-family:var(--font-sans);font-size:18px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--terra-deep)}
  h1{font-size:82px;line-height:.98;color:var(--ink);max-width:15ch}
  h1 .amp{color:var(--terra-deep);font-style:italic}
  .sub{font-family:var(--font-sans);font-size:26px;line-height:1.4;color:var(--ink-2);max-width:34ch;margin-top:20px}
  .rule{height:8px;width:120px;background:var(--terra);border-radius:6px;margin-bottom:24px}
  .foot{display:flex;justify-content:space-between;align-items:flex-end}
  .chips{display:flex;gap:9px}
  .idchip{font-family:var(--font-sans);font-size:16px;font-weight:700;color:#fff;padding:6px 13px;border-radius:999px}
  .handle{font-family:var(--font-sans);font-size:18px;font-weight:700;color:var(--ink)}
</style></head>
<body><div class="board">
  <div class="top"><span class="brandmark">∞</span><span class="kicker">AI-native org design · physical AI</span></div>
  <div>
    <div class="rule"></div>
    <h1>Top-down <span class="amp">vs</span> bottom-up.</h1>
    <div class="sub">You can't <b style="color:var(--ink)">order</b> people to close loops. You design a game where hunting them is the obviously-winning move — and pay the verified fix on-chain.</div>
  </div>
  <div class="foot">
    <div class="chips">
      <span class="idchip" style="background:var(--terra-deep)">maker ≠ checker</span>
      <span class="idchip" style="background:var(--green-deep)">compounding payout</span>
      <span class="idchip" style="background:var(--blue-deep)">safety = zero</span>
    </div>
    <span class="handle">github.com/wjlgatech/physical-ai-native</span>
  </div>
</div></div></body></html>
