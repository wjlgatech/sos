<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="./shared.css">
<style>
  .board{width:1200px;height:627px;padding:56px 64px;display:flex;flex-direction:column;justify-content:space-between}
  .top{display:flex;align-items:center;gap:14px}
  .brandmark{width:34px;height:34px;border-radius:9px;background:var(--terra);display:grid;place-items:center;color:#fff;font-weight:800;font-family:var(--font-sans);font-size:18px}
  .kicker{font-family:var(--font-sans);font-size:19px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--terra-deep)}
  h1{font-size:104px;line-height:.98;color:var(--ink);max-width:16ch}
  h1 .no{color:var(--terra-deep)}
  .sub{font-family:var(--font-sans);font-size:27px;line-height:1.4;color:var(--ink-2);max-width:30ch;margin-top:22px}
  .rule{height:8px;width:120px;background:var(--terra);border-radius:6px;margin-bottom:26px}
  .foot{display:flex;justify-content:space-between;align-items:flex-end}
  .chips{display:flex;gap:9px}
  .idchip{font-family:var(--font-sans);font-size:16px;font-weight:700;color:#fff;padding:6px 13px;border-radius:999px}
  .handle{font-family:var(--font-sans);font-size:19px;font-weight:700;color:var(--ink)}
</style></head>
<body><div class="board">
  <div>
    <div class="top"><span class="brandmark">∞</span><span class="kicker">Loop engineering · a field guide</span></div>
  </div>
  <div>
    <div class="rule"></div>
    <h1>Ship a loop,<br>not a <span class="no">demo</span>.</h1>
    <div class="sub">A demo is a highlight reel. The companies that win ship a <b style="color:var(--ink)">training log</b> — every attempt makes the next one safer and smarter.</div>
  </div>
  <div class="foot">
    <div class="chips">
      <span class="idchip" style="background:var(--terra-deep)">robots</span>
      <span class="idchip" style="background:var(--blue-deep)">agents</span>
      <span class="idchip" style="background:var(--green-deep)">evidence &gt; vibes</span>
    </div>
    <span class="handle">github.com/wjlgatech/sos</span>
  </div>
</div></body></html>
